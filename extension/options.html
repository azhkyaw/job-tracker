<!doctype html>
<meta charset="utf-8">
<style>
  /* Palette mirrors templates/base.html — see popup.html. */
  :root{color-scheme:light dark}
  body{font:14px/1.5 system-ui,sans-serif;color:#141C24;background:#F7F9FA;
       padding:14px;min-width:340px}
  label{display:block;margin:.7em 0 .2em;color:#5A6873;font-size:.85em}
  input{width:100%;box-sizing:border-box;border:1px solid #CCD5DB;border-radius:6px;
        padding:6px 8px;font:inherit;background:transparent;color:#141C24}
  button{margin-top:12px;font:inherit;cursor:pointer;border:1px solid #1F53BE;
         background:#1F53BE;color:#FFFFFF;border-radius:6px;padding:6px 14px}
  #status{color:#26694A;margin-left:.6em}
  @media (prefers-color-scheme: dark){
    body{color:#DBE3EA;background:#181E25}
    label{color:#8695A2}
    input{border-color:#262F39;color:#DBE3EA}
    button{border-color:#7FB0FF;background:#7FB0FF;color:#0A1017}
    #status{color:#6FC793}
  }
</style>
<h3>Job Tracker settings</h3>
<label for="apiBase">API base URL</label>
<input id="apiBase" type="text" placeholder="http://127.0.0.1:8000">
<label for="token">API token (TRACKER_API_TOKEN)</label>
<input id="token" type="password" autocomplete="off">
<button id="save">Save settings</button><span id="status"></span>
<script src="options.js"></script>
