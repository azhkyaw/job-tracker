<!doctype html>
<meta charset="utf-8">
<style>
  body{font:14px/1.5 system-ui,sans-serif;color:#1B2A33;padding:14px;min-width:340px}
  label{display:block;margin:.7em 0 .2em;color:#5E7079;font-size:.85em}
  input{width:100%;box-sizing:border-box;border:1px solid #DAE3E7;border-radius:6px;padding:6px 8px;font:inherit}
  button{margin-top:12px;font:inherit;cursor:pointer;border:1px solid #0E6E66;background:#0E6E66;color:#fff;border-radius:6px;padding:6px 14px}
  #status{color:#0E6E66;margin-left:.6em}
</style>
<h3>Job Tracker settings</h3>
<label for="apiBase">API base URL</label>
<input id="apiBase" type="text" placeholder="http://127.0.0.1:8000">
<label for="token">API token (TRACKER_API_TOKEN)</label>
<input id="token" type="password" autocomplete="off">
<button id="save">Save settings</button><span id="status"></span>
<script src="options.js"></script>
