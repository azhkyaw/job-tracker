# Local Postgres for native-Windows dev (replaces the WSL/apt Postgres the
# docs assume). The pgvector image ships pgvector + pg_trgm, matching
# migrations/001_init.sql (CREATE EXTENSION vector / pg_trgm, hnsw index).
#
#   docker compose up -d          # start
#   docker compose down           # stop (keeps data)
#   docker compose down -v        # stop + wipe the volume
#
# The app connects over TCP from the Windows host; ./migrations is mounted
# read-only so scripts/test.ps1 can run psql -f inside the container without a
# Postgres client installed on Windows.
services:
  db:
    image: pgvector/pgvector:pg15
    container_name: job-tracker-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tracker
    ports:
      # Host port 55432 to avoid colliding with other local Postgres stacks;
      # override with TRACKER_DB_PORT. Container port stays 5432.
      - "${TRACKER_DB_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
