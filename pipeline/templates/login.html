{% extends "base.html" %}
{% block title %}sign in — tracker{% endblock %}
{% block content %}
<h1>Sign in</h1>
{% if error %}<div class="note" style="--c:var(--rejected);max-width:24rem">{{ error }}</div>{% endif %}
<div class="card pad" style="max-width:24rem">
<form method="post" action="/login" class="stack">
  <label>Email <input type="text" name="email" autocomplete="username" required></label>
  <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
  <div class="actions"><button class="primary">Sign in</button>
  {% if signup_allowed %}<a href="/signup">Create an account</a>{% endif %}</div>
</form>
</div>
{% endblock %}
