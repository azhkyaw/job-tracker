{% extends "base.html" %}
{% block title %}edit timeline entry — tracker{% endblock %}
{% block nav_apps %}active{% endblock %}
{% block content %}
<h1>Edit timeline entry</h1>
<p style="color:var(--muted)">For {{ a.company_display }} · {{ a.title_canonical }}.</p>

{% if error %}<p class="empty" style="text-align:left">{{ error }}</p>{% endif %}

<form method="post" action="/applications/{{ a.id }}/events/{{ event.id }}/edit"
      style="display:grid;gap:.5rem;max-width:28rem">
  <label>what happened
    <select name="type">
      {% for value, label in manual_events.items() %}
      <option value="{{ value }}" {% if form.type == value %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </label>
  <label>reason (if rejected)
    <select name="reason">
      <option value="">—</option>
      {% for value, label in event_reasons.items() %}
      <option value="{{ value }}" {% if form.reason == value %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </label>
  <label>how you heard
    <select name="channel">
      <option value="">—</option>
      {% for value, label in event_channels.items() %}
      <option value="{{ value }}" {% if form.channel == value %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </label>
  <label>when it happened
    <input type="date" name="occurred_on" value="{{ form.occurred_on }}" max="{{ today }}">
  </label>
  <label>detail
    <input type="text" name="note" value="{{ form.note }}">
  </label>

  <div>
    <button class="primary">Save changes</button>
    <a href="/applications/{{ a.id }}"><button type="button">Cancel</button></a>
  </div>
</form>

<h2 style="color:var(--rejected);margin-top:1.5rem">Danger zone</h2>
<form method="post" action="/applications/{{ a.id }}/events/{{ event.id }}/delete">
  <button style="border-color:var(--rejected);color:var(--rejected)">Delete this entry</button>
</form>
{% endblock %}
