{% extends "base.html" %}
{% block title %}create account — tracker{% endblock %}
{% block content %}
<h1>Create an account</h1>
{% if error %}<div class="note" style="--c:var(--rejected);max-width:24rem">{{ error }}</div>{% endif %}
<div class="card pad" style="max-width:24rem">
<form method="post" action="/signup" class="stack">
  <label>Email <input type="text" name="email" autocomplete="username" required></label>
  <label>Password, 8 characters or more <input type="password" name="password" autocomplete="new-password" required></label>
  <div class="actions"><button class="primary">Create account</button>
  <a href="/login">I have an account</a></div>
</form>
</div>
{% endblock %}
