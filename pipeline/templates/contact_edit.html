{% extends "base.html" %}
{% block title %}edit contact — tracker{% endblock %}
{% block nav_apps %}active{% endblock %}
{% block content %}
<h1>Edit contact</h1>
<p class="lede" style="margin-top:-.4rem">For {{ a.company_display }}, {{ a.title_canonical }}.</p>

{% if error %}<div class="note" style="--c:var(--rejected)">{{ error }}</div>{% endif %}

<form method="post" action="/applications/{{ a.id }}/contacts/{{ contact.id }}/edit" class="stack" style="max-width:28rem">
  <label>Name <input type="text" name="name" value="{{ form.name }}" required></label>
  <label>Role <input type="text" name="role" value="{{ form.role }}"></label>
  <label>Profile URL <input type="text" name="url" value="{{ form.url }}"></label>
  <label class="row">
    <input type="checkbox" name="approached" value="yes" {% if form.approached == 'yes' %}checked{% endif %}>
    Approached</label>
  <label>Notes
    <textarea name="notes" rows="4">{{ form.notes }}</textarea>
  </label>
  <div class="actions">
    <button class="primary">Save changes</button>
    <a href="/applications/{{ a.id }}">Cancel</a>
  </div>
</form>

<h2>Remove</h2>
<form method="post" action="/applications/{{ a.id }}/contacts/{{ contact.id }}/delete">
  <button class="danger">Delete this contact</button>
</form>
{% endblock %}
